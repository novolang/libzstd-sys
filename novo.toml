[package]
name        = "libzstd-sys"
version     = "0.1.1"
description = "Bindings over libzstd, the Zstandard compression library: the one-shot calls, the compression and decompression contexts, the streaming interface, the dictionary loaders, the error reporting and the version, one declaration per C entry point."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used
# the package yet, and the tests exercise the entry points rather than
# a consumer's use of them.
stability   = "experimental"

# `sys`: the layer for a package that binds one C library and decides
# nothing of its own.  Every `pub fn` below is an `@ffi` declaration of
# a function in libzstd.
layer       = "sys"

category    = "bindings"

# The one C library.  `libzstd.so` is what the loader resolves these
# symbols against.  Installing this package does not install it.
wraps       = "libzstd"

tags        = ["ffi", "zstd", "zstandard", "compression", "codec", "bindings"]
repository  = "https://github.com/novolang/libzstd-sys"
maintainers = ["novo-lang"]
novo        = ">= 0.8.9"

[docs.pages]
"README.md" = "The C entry points of libzstd, one novo-lang declaration each"

[dependencies]
# None.  A binding over one C library depends on no novo-lang package.

# The link flag for the `library = "zstd"` name every declaration in
# `src/` carries.  `libzstd-dev` installs
# `/usr/lib/<arch>/pkgconfig/libzstd.pc`, so pkg-config answers
# `-lzstd` on Debian and Ubuntu.  Without the block the default is
# `-lzstd`, which is the same flag on a system that put the library
# somewhere the linker already looks.
[ffi.zstd]
pkg_config = "libzstd"
